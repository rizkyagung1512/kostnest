{% extends "base.html" %}

{% block title %}Masuk ke KosNest | Info & Booking Kos{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-teal-subtle text-success p-3 rounded-circle mb-2" style="background-color: #ccfbf1;">
        <i class="bi bi-houses-fill fs-2" style="color: #0f766e;"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Masuk ke KosNest</h3>
      <p class="text-muted small">Cari kamar impian, cek slot kosong & booking secara mudah</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="identifier" class="form-label fw-semibold small">Username atau Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control border-start-0" id="identifier" name="identifier" placeholder="" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <label for="password" class="form-label fw-semibold small mb-0">Password</label>
        </div>
        <div class="input-group mt-1">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="••••••••" required>
          <button type="button" class="input-group-text bg-white border-start-0 text-muted" id="togglePassword" title="Tampilkan/Sembunyikan password">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-pill" style="background-color: #0f766e; border-color: #0f766e;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sekarang
        </button>
      </div>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
      <p class="text-muted small mb-0">
        Belum punya akun? 
        <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none" style="color: #0f766e;">Daftar Akun Baru</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
