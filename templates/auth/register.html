{% extends "base.html" %}

{% block title %}Pendaftaran Akun Baru | KosNest{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-2" style="background-color: #ccfbf1;">
        <i class="bi bi-person-plus-fill fs-2" style="color: #0f766e;"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Daftar Akun Calon Penghuni</h3>
      <p class="text-muted small">Pendaftaran otomatis mendapatkan peran sebagai <strong>Penghuni / User</strong></p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label for="full_name" class="form-label fw-semibold small">Nama Lengkap</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
          <input type="text" class="form-control border-start-0" id="full_name" name="full_name" placeholder="mis. Titut Khoirunnisa" required autofocus>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="username" class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted">@</span>
            <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="titut" required>
          </div>
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label fw-semibold small">No. WhatsApp/HP</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-whatsapp"></i></span>
            <input type="tel" class="form-control border-start-0" id="phone" name="phone" placeholder="08123456789" required>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">Alamat Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="titut@student.ac.id" required>
        </div>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-md-6">
          <label for="password" class="form-label fw-semibold small">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 karakter" required minlength="6">
        </div>
        <div class="col-md-6">
          <label for="confirm_password" class="form-label fw-semibold small">Ulangi Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Ulangi password" required minlength="6">
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-pill" style="background-color: #0f766e; border-color: #0f766e;">
          <i class="bi bi-check2-circle me-1"></i> Buat Akun Penghuni
        </button>
      </div>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
      <p class="text-muted small mb-0">
        Sudah memiliki akun? 
        <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #0f766e;">Masuk di sini</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
